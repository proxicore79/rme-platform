# Netlify configuration for Royal Mail Express International
[build]
  command = "npm ci --omit=dev || npm install"
  # Only static assets are deployed as files; every page/API is rendered by
  # the Express app running as a serverless function.
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve static files from /public when present, otherwise send everything to
# the Express function.
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/img/*"
  to = "/img/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
